name: HACS validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Remove once the integration has an entry in home-assistant/brands.
          ignore: brands
